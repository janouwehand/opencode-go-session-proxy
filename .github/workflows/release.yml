name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, bijvoorbeeld v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test OpenCodeGoProxy.sln -c Release

      - name: Restore
        run: dotnet restore src/OpenCodeGoProxy/OpenCodeGoProxy.csproj -r win-x64 -v detailed

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/OpenCodeGoProxy/OpenCodeGoProxy.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:Version="${TAG#v}"
          -o publish/OpenCodeGoProxy

      - name: Package
        shell: pwsh
        run: |
          Copy-Item deploy/*.ps1 publish/OpenCodeGoProxy/
          $zip = "OpenCodeGoProxy-$env:TAG-win-x64.zip"
          Compress-Archive -Path publish/OpenCodeGoProxy/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:TAG
          OpenCodeGoProxy-$env:TAG-win-x64.zip
          OpenCodeGoProxy-$env:TAG-win-x64.zip.sha256
          --generate-notes --title $env:TAG
