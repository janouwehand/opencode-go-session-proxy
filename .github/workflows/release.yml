name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test OpenCodeGoProxy.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/OpenCodeGoProxy/OpenCodeGoProxy.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ github.ref_name }}
          -o publish/OpenCodeGoProxy

      - name: Package
        shell: pwsh
        run: |
          Copy-Item deploy/*.ps1 publish/OpenCodeGoProxy/
          $zip = "OpenCodeGoProxy-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/OpenCodeGoProxy/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          OpenCodeGoProxy-${{ github.ref_name }}-win-x64.zip
          OpenCodeGoProxy-${{ github.ref_name }}-win-x64.zip.sha256
          --generate-notes --title "${{ github.ref_name }}"
